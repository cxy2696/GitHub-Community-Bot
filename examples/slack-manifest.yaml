display_information:
  name: GitHub Community Bot
  description: Local-AI GitHub community momentum, right inside Slack.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: GitHub Community Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false

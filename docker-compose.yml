services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATA_DIR: /data
      DATABASE_PATH: /data/community.db
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - bot-data:/data
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  ollama-data:
  bot-data:
